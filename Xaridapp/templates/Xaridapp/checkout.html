<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Buyurtmani rasmiylashtirish — XaridGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h3 class="fw-bold mb-4">Buyurtmani rasmiylashtirish</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Ismingiz</label>
                    <input type="text" name="first_name" class="form-control" required placeholder="Ismingizni kiriting">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Telefon raqam</label>
                    <input type="text" name="phone" class="form-control" required placeholder="+998 90 123 45 67">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Yetkazib berish manzili</label>
                    <textarea name="address" class="form-control" rows="3" required placeholder="Viloyat, tuman, ko'cha, uy raqami"></textarea>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <span class="text-muted">Jami to'lov:</span>
                    <span class="fw-bold fs-4 text-dark">{{ total_price }} so'm</span>
                </div>
                <button type="submit" class="btn text-white fw-semibold rounded-pill py-2 w-100" style="background-color: #7000ff;">
                    To'lov sahifasiga o'tish
                </button>
            </form>
        </div>
    </div>
</body>
</html>
