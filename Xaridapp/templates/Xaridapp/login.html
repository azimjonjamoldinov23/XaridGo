<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XaridGo - Tizimga kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f5f7; font-family: Arial, sans-serif; }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 450px;
            margin: 50px auto;
        }
        .btn-uzum {
            background-color: #7000ff;
            color: white;
            font-weight: bold;
            border-radius: 8px;
        }
        .btn-uzum:hover {
            background-color: #5b00cc;
            color: white;
        }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            background-color: #f9f9f9;
            font-size: 14px;
        }
        .login-card input:focus {
            border-color: #7000ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(112, 0, 255, 0.1);
            background-color: #fff;
        }
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input {
            padding-right: 40px !important;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #6c757d;
            font-size: 15px;
            z-index: 10;
        }
        .toggle-password:hover {
            color: #7000ff;
        }
        label {
            font-weight: 500;
            font-size: 13px;
            color: #333;
            margin-bottom: 4px;
            margin-top: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-card">
            <h3 class="text-center fw-bold mb-1" style="color: #7000ff;">🛒 XaridGo</h3>
            <p class="text-center text-muted mb-4" style="font-size: 14px;">Tizimga kirish</p>
            
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label>{{ field.label }}</label>
                        
                        {% if "password" in field.name.lower %}
                            <div class="password-container">
                                {{ field }}
                                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword(this)"></i>
                            </div>
                        {% else %}
                            {{ field }}
                        {% endif %}
                        
                        {% for error in field.errors %}
                            <div class="text-danger" style="font-size: 12px;">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="btn btn-uzum w-100 py-2 mt-3">Kirish</button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'index' %}" class="text-decoration-none text-muted small">← Bosh sahifaga qaytish</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(element) {
            const input = element.previousElementSibling;
            if (input.type === "password") {
                input.type = "text";
                element.classList.remove("fa-eye");
                element.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                element.classList.remove("fa-eye-slash");
                element.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
