<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} — XaridGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .product-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .img-box {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .btn-add-cart {
            background-color: #7000ff;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 15px 30px;
            border: none;
            width: 100%;
            transition: 0.2s;
        }
        .btn-add-cart:hover {
            background-color: #5b00cc;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <!-- Asosiy sahifaga qaytish -->
        <div class="mb-4">
            <a href="{% url 'index' %}" class="text-decoration-none text-muted">
                <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary w-100" style="background-color: #7000ff; border: none;">Savatga qo'shish</a>
                <i class="fa-solid fa-arrow-left me-2"></i> Orqaga qaytish
            </a>
        </div>

        <div class="product-container">
            <div class="row">
                <!-- Rasm qismi -->
                <div class="col-md-5">
                    <div class="img-box h-100">
                        {% if product.image %}
                            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid rounded-4" style="max-height: 400px; object-fit: contain;">
                        {% else %}
                            <div class="text-muted p-5">Rasm mavjud emas</div>
                        {% endif %}
                    </div>
                </div>

                <!-- Ma'lumot qismi -->
                <div class="col-md-7 ps-md-5">
                    <h1 class="fw-bold text-dark mb-3">{{ product.name }}</h1>
                    <p class="text-muted mb-4">{{ product.description }}</p>
                    
                    <div class="mb-4">
                        <h2 class="fw-bold text-dark">{{ product.price }} so'm</h2>
                    </div>

                    <div class="d-flex gap-3">
                        <button class="btn btn-add-cart" onclick="alert('Savatga qo\'shildi!')">
                            <i class="fa-solid fa-cart-plus me-2"></i> Savatga qo'shish
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
